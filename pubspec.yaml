name: flutter_clean_arch_unicorn
description: Flutter Clean Architecture starter with Riverpod 3.4.1, GoRouter, Freezed — production-ready foundation for unicorn startups.

publish_to: "none"

version: 1.4.0+1

environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  connectivity_plus: ^7.3.1
  cupertino_icons: ^1.0.2
  dio: ^5.4.0
  equatable: ^2.0.5
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.1
  go_router: ^16.3.0
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0
  shared_preferences: ^2.2.0
  flutter_secure_storage: ^10.0.0
  crypto: ^3.0.3
  logger: ^2.5.0
  intl: ^0.19.0
  path_provider: ^2.1.0
  path: ^1.9.0
  drift: ^2.34.3
  sqlite3_flutter_libs: ^0.6.0+eol
  sqlite3: ^3.5.1

dev_dependencies:
  build_runner: ^2.4.5
  drift_dev: ^2.34.0
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  freezed: ^3.2.5
  http_mock_adapter: ^0.6.1
  json_serializable: ^6.9.0
  mocktail: ^1.0.2
  test_coverage_badge: ^0.3.2

flutter:
  uses-material-design: true

  assets:
    - test/features/dashboard/data/datasource/